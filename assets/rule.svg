  <rect width="1200" height="2" fill="url(#r)">
    <animate attributeName="opacity" values="0.5;1;0.5" keyTimes="0;0.5;1" dur="6s" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1" repeatCount="indefinite"/>
